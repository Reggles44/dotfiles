####################################
# Theme & Style
####################################
# Catppuccin-Macchiato
# include macchiato.conf

# Gruvbox Dark
# include gruvbox_dark.conf

# window
remember_window_size  no
initial_window_width  128c
initial_window_height 32c

window_padding_width 5

background_opacity 0.2

####################################
# Font
####################################

font_family      family='Hacklug Nerd Font Mono'
bold_font        family='Hacklug Nerd Font Mono' style=Bold
italic_font      family='Hacklug Nerd Font Mono' style=Italic
bold_italic_font family='Hacklug Nerd Font Mono' style='Bold Italic'

font_size 10.0
symbol_map U+e000-U+e00a,U+ea60-U+ebeb,U+e0a0-U+e0c8,U+e0ca,U+e0cc-U+e0d7,U+e200-U+e2a9,U+e300-U+e3e3,U+e5fa-U+e6b7,U+e700-U+e8ef,U+ed00-U+efc1,U+f000-U+f2ff,U+f000-U+f2e0,U+f300-U+f381,U+f400-U+f533,U+f0001-U+f1af0 Symbols Nerd Font Mono
modify_font cell_height 110%

####################################
# Settings
####################################

# No stupid close confirmation
confirm_os_window_close 0

# cursor
cursor_blink_interval 0

# mouse
# hide mouse when typing
mouse_hide_wait -1.0

# clipboard
copy_on_select clipboard

# performance
repaint_delay 16

# system
# macos settings
macos_titlebar_color dark
macos_option_as_alt yes

# in wslg only x11 works
# linux_display_server X11
linux_display_server auto

